# Pull request previews on pkg.pr.new. This file is read from the default branch
# (pull_request_target) so the author check cannot be removed by the pull request.
# Previews run only for a same-repository branch whose author is an owner, member,
# or collaborator. Fork pull requests are skipped, including when the author is an
# owner, member, or collaborator. A maintainer can push that branch into this
# repository and open the pull request from there. Do not check out fork code from
# this workflow.
# It grants no token permissions and must not gain secrets, id-token, or an npm environment.
# Preview tarballs are not npm releases and have no npm provenance.

name: Pull request package previews

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

concurrency:
  group: pkg-pr-new-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Publish pkg.pr.new preview
    if: github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN NPM_TOKEN NODE_AUTH_TOKEN
          bun install --frozen-lockfile --ignore-scripts

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN NPM_TOKEN NODE_AUTH_TOKEN
          bun run build

      - name: Install pinned pkg.pr.new CLI
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN NPM_TOKEN NODE_AUTH_TOKEN
          npm install --prefix "$RUNNER_TEMP/pkg-pr-new" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org pkg-pr-new@0.0.91

      - name: Publish preview packages outside npm
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN NPM_TOKEN NODE_AUTH_TOKEN
          npm exec --prefix "$RUNNER_TEMP/pkg-pr-new" -- pkg-pr-new publish --bun --packageManager=bun --previewVersion --no-template --comment=update './packages/*'

      - name: Record that previews have no npm provenance
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          These packages were uploaded to pkg.pr.new for this pull request.
          They are not published to npm, they do not use the `latest` or `next` dist-tags, and they have no npm provenance attestation.
          EOF
