name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node for package consumer smoke
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Scan tracked files for secrets
        run: bun run scripts/scan-secrets.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        run: bun audit

      - name: Typecheck
        run: bun run typecheck

      - name: Documentation
        run: bun run docs:check

      - name: Test
        run: bun run test

      - name: Generate provider conformance report from offline evidence
        run: >-
          bun run provider:conformance
          --offline-passed
          --baseline=scripts/fixtures/provider-conformance-baseline-v1.json
          --gate=warn
          --json="$RUNNER_TEMP/provider-conformance-offline.json"
          --markdown="$RUNNER_TEMP/provider-conformance-offline.md"

      - name: Add provider conformance summary
        run: cat "$RUNNER_TEMP/provider-conformance-offline.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Certify workflow state with SQLite
        run: bun run test:integration:workflows-sqlite

      - name: Enforce workflow evaluation baseline
        run: bun run test:workflow-evaluation-gate

      - name: Build
        run: bun run build

      - name: Bundle package build output
        run: tar -czf "$RUNNER_TEMP/package-dist.tgz" packages/*/dist

      - name: Upload package build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-dist
          path: |
            ${{ runner.temp }}/package-dist.tgz
            ${{ runner.temp }}/provider-conformance-offline.json
            ${{ runner.temp }}/provider-conformance-offline.md
          if-no-files-found: error
          retention-days: 1

  package-consumer:
    name: Packed packages / Node ${{ matrix.node-version }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 18.18.0
            otel-sdk-version: 1.30.1
          - node-version: 24
            otel-sdk-version: 2.10.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download package build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-dist
          path: ${{ runner.temp }}/package-dist

      - name: Restore package build output
        run: tar -xzf "$RUNNER_TEMP/package-dist/package-dist.tgz"

      - name: Verify packed packages and OTEL with Node
        env:
          ZHIVEX_OTEL_SDK_VERSION: ${{ matrix.otel-sdk-version }}
          ZHIVEX_PROVIDER_CONFORMANCE_INSTALLED_OUTPUT: ${{ runner.temp }}/provider-conformance-installed.json
        run: bun run scripts/package-consumer-smoke.ts

      - name: Merge installed provider conformance evidence
        run: >-
          bun run provider:conformance
          --merge="$RUNNER_TEMP/package-dist/provider-conformance-offline.json,$RUNNER_TEMP/provider-conformance-installed.json"
          --baseline=scripts/fixtures/provider-conformance-baseline-v1.json
          --gate=warn
          --json="$RUNNER_TEMP/provider-conformance.json"
          --markdown="$RUNNER_TEMP/provider-conformance.md"

      - name: Add installed conformance summary
        run: cat "$RUNNER_TEMP/provider-conformance.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload provider conformance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-conformance-node-${{ matrix.node-version }}
          path: |
            ${{ runner.temp }}/provider-conformance.json
            ${{ runner.temp }}/provider-conformance.md
            ${{ runner.temp }}/provider-conformance-installed.json
          if-no-files-found: error
          retention-days: 14

  workflow-postgres:
    name: Workflow state / Postgres certification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zhivex_workflow_ci
          POSTGRES_PASSWORD: zhivex_ci_password
          POSTGRES_USER: zhivex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhivex_ci -d zhivex_workflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ZHIVEX_POSTGRES_INTEGRATION_URL: postgres://zhivex_ci:zhivex_ci_password@127.0.0.1:5432/zhivex_workflow_ci

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run fail-closed Postgres workflow certification
        run: bun run test:integration:workflows-postgres

      - name: Certify installed SDK package against Postgres
        run: bun run smoke:packages:workflows-postgres

  provider-conformance-attestation:
    name: Provider conformance provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package-consumer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download Node 24 provider conformance evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provider-conformance-node-24
          path: ${{ runner.temp }}/provider-conformance

      - name: Attest provider conformance report
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/provider-conformance/provider-conformance.json
