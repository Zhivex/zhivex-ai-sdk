name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node for package consumer smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Scan tracked files for secrets
        run: bun run scripts/scan-secrets.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        run: bun audit

      - name: Typecheck
        run: bun run typecheck

      - name: Documentation
        run: bun run docs:check

      - name: Test
        run: bun run test

      - name: Certify workflow state with SQLite
        run: bun run test:integration:workflows-sqlite

      - name: Enforce workflow evaluation baseline
        run: bun run test:workflow-evaluation-gate

      - name: Build
        run: bun run build

      - name: Bundle package build output
        run: tar -czf "$RUNNER_TEMP/package-dist.tgz" packages/*/dist

      - name: Upload package build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-dist
          path: ${{ runner.temp }}/package-dist.tgz
          if-no-files-found: error
          retention-days: 1

  package-consumer:
    name: Packed packages / Node ${{ matrix.node-version }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 18.18.0
            otel-sdk-version: 1.30.1
          - node-version: 24
            otel-sdk-version: 2.10.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Download package build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-dist
          path: ${{ runner.temp }}/package-dist

      - name: Restore package build output
        run: tar -xzf "$RUNNER_TEMP/package-dist/package-dist.tgz"

      - name: Verify packed packages and OTEL with Node
        env:
          ZHIVEX_OTEL_SDK_VERSION: ${{ matrix.otel-sdk-version }}
        run: bun run scripts/package-consumer-smoke.ts

  workflow-postgres:
    name: Workflow state / Postgres certification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zhivex_workflow_ci
          POSTGRES_PASSWORD: zhivex_ci_password
          POSTGRES_USER: zhivex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhivex_ci -d zhivex_workflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ZHIVEX_POSTGRES_INTEGRATION_URL: postgres://zhivex_ci:zhivex_ci_password@127.0.0.1:5432/zhivex_workflow_ci

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run fail-closed Postgres workflow certification
        run: bun run test:integration:workflows-postgres

      - name: Certify installed SDK package against Postgres
        run: bun run smoke:packages:workflows-postgres
