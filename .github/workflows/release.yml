name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm dist-tag to publish
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      release_tags_json: ${{ steps.release_tags.outputs.tags_json }}
      has_release_tags: ${{ steps.release_tags.outputs.has_tags }}

    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Verify npm supports trusted publishing
        run: >-
          node -e 'const { execFileSync } = require("node:child_process"); const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim(); const [major, minor] = version.split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) throw new Error(`npm ${version} does not support trusted publishing; require >=11.5.1`);'

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        run: bun audit

      - name: Typecheck
        run: bun run typecheck

      - name: Documentation
        run: bun run docs:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Snapshot existing package tags
        shell: bash
        run: |
          export LC_ALL=C
          git tag --list | sort > "$RUNNER_TEMP/tags-before"

      - name: Publish stable packages with OIDC
        if: inputs.channel == 'latest'
        run: bun run release

      - name: Publish prerelease packages with OIDC
        if: inputs.channel == 'next'
        run: bun run release:next

      - name: Collect new package tags
        id: release_tags
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          new_tags="$(comm -13 "$RUNNER_TEMP/tags-before" <(git tag --list | sort))"

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [[ ! "$tag" =~ ^@zhivex-ai/[a-z0-9][a-z0-9-]*@[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Unexpected release tag generated by Changesets: $tag" >&2
              exit 1
            fi
          done <<< "$new_tags"

          tags_json="$(
            printf '%s\n' "$new_tags" |
              jq -R -s -c 'split("\n") | map(select(length > 0))'
          )"
          echo "tags_json=$tags_json" >> "$GITHUB_OUTPUT"
          if [ "$tags_json" = "[]" ]; then
            echo "has_tags=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_tags=true" >> "$GITHUB_OUTPUT"
          fi

  push_tags:
    name: Push verified release tags
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.has_release_tags == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout published source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and push only published package tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS_JSON: ${{ needs.publish.outputs.release_tags_json }}
        run: |
          set -euo pipefail

          mapfile -t release_tags < <(jq -r '.[]' <<< "$RELEASE_TAGS_JSON")
          if [ "${#release_tags[@]}" -eq 0 ]; then
            echo "No release tags were supplied." >&2
            exit 1
          fi

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [[ ! "$tag" =~ ^(@zhivex-ai/[a-z0-9][a-z0-9-]*)@([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              echo "Refusing unexpected release tag: $tag" >&2
              exit 1
            fi

            package_name="${BASH_REMATCH[1]}"
            package_version="${BASH_REMATCH[2]}"
            manifest_version="$(
              for manifest in packages/*/package.json; do
                jq -r --arg name "$package_name" 'select(.name == $name) | .version' "$manifest"
              done
            )"

            if [ "$manifest_version" != "$package_version" ]; then
              echo "Tag $tag does not match a committed package manifest." >&2
              exit 1
            fi

            remote_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
            if [ -n "$remote_sha" ] && [ "$remote_sha" != "$GITHUB_SHA" ]; then
              echo "Tag $tag already exists at a different commit." >&2
              exit 1
            fi
          done < <(printf '%s\n' "${release_tags[@]}")

          gh auth setup-git
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            remote_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
            if [ "$remote_sha" = "$GITHUB_SHA" ]; then
              continue
            fi
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag:refs/tags/$tag"
          done < <(printf '%s\n' "${release_tags[@]}")

      - name: Publish aggregate GitHub release
        if: inputs.channel == 'latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS_JSON: ${{ needs.publish.outputs.release_tags_json }}
        run: |
          set -euo pipefail

          sdk_tag="$(
            jq -r '.[] | select(startswith("@zhivex-ai/sdk@"))' \
              <<< "$RELEASE_TAGS_JSON"
          )"
          if [ -z "$sdk_tag" ]; then
            echo "No @zhivex-ai/sdk tag was generated; skipping aggregate release."
            exit 0
          fi

          gh release create "$sdk_tag" \
            --verify-tag \
            --generate-notes \
            --title "Zhivex AI SDK ${sdk_tag##*@}"
