name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm dist-tag to publish
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node for package validation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Scan tracked files for secrets
        run: bun run scripts/scan-secrets.ts

      - name: Check workspace lock snapshots
        run: bun run lock:check

      - name: Audit dependencies
        run: bun audit

      - name: Provider registry coherence
        run: bun run provider:check

      - name: Typecheck
        run: bun run typecheck

      - name: Documentation
        run: bun run docs:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Certify installed Stable MCP HTTP and OAuth
        run: bun run scripts/mcp-package-smoke.ts

      - name: Verify packed packages with Node
        run: bun run scripts/package-consumer-smoke.ts

      - name: Select stable release batch
        if: inputs.channel == 'latest'
        run: |
          mkdir -p .release
          bun run scripts/check-release-readiness.ts --release-batch-file=.release/zhivex-release-batch.json

      - name: Select prerelease batch
        if: inputs.channel == 'next'
        run: |
          mkdir -p .release
          bun run scripts/check-release-readiness.ts --tag=next --release-batch-file=.release/zhivex-release-batch.json

      - name: Pack immutable release tarballs
        run: bun run scripts/release-artifacts.ts prepare --git-head="$GITHUB_SHA"

      - name: Bind release tarballs to SHA-512 checksums
        shell: bash
        run: |
          set -euo pipefail
          find .release -type f \
            \( -name '*.tgz' -o -name 'zhivex-release-batch.json' -o -name 'release-artifacts.json' \) \
            -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 shasum -a 512 > .release/SHA512SUMS
          test -s .release/SHA512SUMS

      - name: Upload immutable validated release source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source-${{ github.sha }}
          path: |
            .release/tarballs/*.tgz
            .release/zhivex-release-batch.json
            .release/release-artifacts.json
            .release/SHA512SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: validate
    if: needs.validate.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm supports trusted publishing
        run: >-
          node -e 'const { execFileSync } = require("node:child_process"); const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim(); const [major, minor] = version.split(".").map(Number); if (major < 11 || (major === 11 && minor < 5)) throw new Error(`npm ${version} does not support trusted publishing; require >=11.5.1`);'

      - name: Download validated release source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source-${{ github.sha }}
          path: .release

      - name: Verify validated package bytes
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 512 -c .release/SHA512SUMS

      - name: Publish checksum-verified tarballs with provenance
        env:
          RELEASE_TAG: ${{ inputs.channel }}
          RELEASE_GIT_HEAD: ${{ github.sha }}
        run: |
          node <<'END_PUBLISH'
          const { execFileSync } = require("node:child_process");
          const { createHash } = require("node:crypto");
          const { lstatSync, readFileSync } = require("node:fs");
          const path = require("node:path");

          const packageIdentity = /^(@zhivex-ai\/[a-z0-9][a-z0-9-]*)@(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$/;
          const tarballPattern = /^[a-z0-9][a-z0-9._-]*\.tgz$/;
          const tag = process.env.RELEASE_TAG;
          const gitHead = process.env.RELEASE_GIT_HEAD;
          if (tag !== "latest" && tag !== "next") {
            throw new Error("Unsupported release tag.");
          }
          if (!/^[a-f0-9]{40}$/.test(gitHead ?? "")) {
            throw new Error("Invalid release git head.");
          }

          const releaseDirectory = path.resolve(".release");
          const artifactDirectory = path.resolve(releaseDirectory, "tarballs");
          const readJson = (file) => JSON.parse(readFileSync(file, "utf8"));
          const manifest = readJson(path.join(releaseDirectory, "release-artifacts.json"));
          const batch = readJson(path.join(releaseDirectory, "zhivex-release-batch.json"));
          if (manifest.schemaVersion !== 1 || manifest.gitHead !== gitHead || !Array.isArray(manifest.packages)) {
            throw new Error("Release artifact manifest is not bound to the expected commit.");
          }
          if (!Array.isArray(batch) || batch.some((entry) => typeof entry !== "string" || !packageIdentity.test(entry))) {
            throw new Error("Release batch must contain only validated package identities.");
          }
          if (new Set(batch).size !== batch.length) {
            throw new Error("Release batch contains duplicate package identities.");
          }
          const expectedBatch = [...batch].sort();
          const sha512File = (filePath) => createHash("sha512").update(readFileSync(filePath)).digest("hex");
          const entries = manifest.packages.map((entry) => {
            const identity = `${entry.name}@${entry.version}`;
            if (!packageIdentity.test(identity) || !tarballPattern.test(entry.tarball) || !/^[a-f0-9]{128}$/.test(entry.sha512)) {
              throw new Error(`Invalid release artifact entry: ${identity}`);
            }
            const tarballPath = path.resolve(artifactDirectory, entry.tarball);
            if (path.dirname(tarballPath) !== artifactDirectory) {
              throw new Error(`Release tarball escapes its artifact directory: ${entry.tarball}`);
            }
            const stat = lstatSync(tarballPath);
            if (!stat.isFile() || stat.isSymbolicLink()) {
              throw new Error(`Release tarball must be a regular file: ${entry.tarball}`);
            }
            if (sha512File(tarballPath) !== entry.sha512) {
              throw new Error(`Release tarball checksum mismatch: ${entry.tarball}`);
            }
            return { identity, tarballPath };
          });
          const actualBatch = entries.map((entry) => entry.identity).sort();
          if (JSON.stringify(actualBatch) !== JSON.stringify(expectedBatch)) {
            throw new Error("Release artifact manifest does not match the selected release batch.");
          }
          if (new Set(entries.map((entry) => entry.tarballPath)).size !== entries.length) {
            throw new Error("Release artifact manifest contains duplicate tarballs.");
          }
          // A rerun must not publish over versions that an earlier attempt already accepted.
          // An existing version is skipped only when npm holds exactly these tarball bytes.
          const registry = "https://registry.npmjs.org";
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const localDigests = (tarballPath) => {
            const bytes = readFileSync(tarballPath);
            return {
              integrity: `sha512-${createHash("sha512").update(bytes).digest("base64")}`,
              shasum: createHash("sha1").update(bytes).digest("hex")
            };
          };
          const readPublishedDist = async (identity, attempts) => {
            const [, name, version] = packageIdentity.exec(identity);
            const url = `${registry}/${name.replace("/", "%2f")}/${encodeURIComponent(version)}`;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const response = await fetch(url, { headers: { accept: "application/json" }, cache: "no-store" });
              if (response.status === 200) {
                const document = await response.json();
                if (document?.version !== version || typeof document?.dist !== "object" || document.dist === null) {
                  throw new Error(`Registry returned malformed metadata for ${identity}.`);
                }
                return document.dist;
              }
              if (response.status !== 404) {
                throw new Error(`Registry read for ${identity} failed with HTTP ${response.status}.`);
              }
              if (attempt < attempts) {
                await sleep(5000 * attempt);
              }
            }
            return undefined;
          };
          const requireSameBytes = (identity, dist, local) => {
            if (dist.integrity !== local.integrity || (dist.shasum !== undefined && dist.shasum !== local.shasum)) {
              throw new Error(
                `${identity} is already on npm with different bytes (registry ${dist.integrity}, local ${local.integrity}). Refusing to continue.`
              );
            }
          };
          const main = async () => {
            let published = 0;
            let skipped = 0;
            for (const entry of entries) {
              const local = localDigests(entry.tarballPath);
              const existing = await readPublishedDist(entry.identity, 3);
              if (existing) {
                requireSameBytes(entry.identity, existing, local);
                console.log(`Skipping ${entry.identity}: npm already has identical bytes (${local.integrity}).`);
                skipped += 1;
                continue;
              }
              try {
                execFileSync(
                  "npm",
                  ["publish", entry.tarballPath, "--tag", tag, "--access", "public", "--provenance"],
                  { stdio: "inherit" }
                );
                published += 1;
              } catch (error) {
                // npm may reject a version that became visible only after the read above.
                const raced = await readPublishedDist(entry.identity, 1);
                if (!raced) {
                  throw error;
                }
                requireSameBytes(entry.identity, raced, local);
                console.log(`Skipping ${entry.identity}: npm accepted identical bytes before this attempt.`);
                skipped += 1;
              }
            }
            console.log(`Published ${published} and skipped ${skipped} already-published verified release tarball(s) with dist-tag ${tag}.`);
          };
          main().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          END_PUBLISH

  collect_tags:
    name: Collect published package tags
    needs: verify_public
    if: needs.verify_public.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release_tags_json: ${{ steps.release_tags.outputs.tags_json }}
      has_release_tags: ${{ steps.release_tags.outputs.has_tags }}

    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Collect packages published from this release commit
        id: release_tags
        shell: bash
        run: |
          set -euo pipefail
          tags_json="$(bun scripts/collect-release-tags.ts --git-head="$GITHUB_SHA")"
          echo "tags_json=$tags_json" >> "$GITHUB_OUTPUT"
          if [ "$tags_json" = "[]" ]; then
            echo "has_tags=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_tags=true" >> "$GITHUB_OUTPUT"
          fi

  push_tags:
    name: Push verified release tags
    needs: collect_tags
    if: needs.collect_tags.result == 'success' && needs.collect_tags.outputs.has_release_tags == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout published source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and push only published package tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS_JSON: ${{ needs.collect_tags.outputs.release_tags_json }}
        run: |
          set -euo pipefail

          remote_tag_commit() {
            local tag="$1"
            local tag_sha
            local peeled_sha
            tag_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
            peeled_sha="$(git ls-remote --tags origin "refs/tags/$tag^{}" | awk '{print $1}')"
            printf '%s' "${peeled_sha:-$tag_sha}"
          }

          mapfile -t release_tags < <(jq -r '.[]' <<< "$RELEASE_TAGS_JSON")
          if [ "${#release_tags[@]}" -eq 0 ]; then
            echo "No release tags were supplied." >&2
            exit 1
          fi

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [[ ! "$tag" =~ ^(@zhivex-ai/[a-z0-9][a-z0-9-]*)@([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              echo "Refusing unexpected release tag: $tag" >&2
              exit 1
            fi

            package_name="${BASH_REMATCH[1]}"
            package_version="${BASH_REMATCH[2]}"
            manifest_version="$(
              for manifest in packages/*/package.json; do
                jq -r --arg name "$package_name" 'select(.name == $name) | .version' "$manifest"
              done
            )"

            if [ "$manifest_version" != "$package_version" ]; then
              echo "Tag $tag does not match a committed package manifest." >&2
              exit 1
            fi

            remote_sha="$(remote_tag_commit "$tag")"
            if [ -n "$remote_sha" ] && [ "$remote_sha" != "$GITHUB_SHA" ]; then
              echo "Tag $tag already exists at a different commit." >&2
              exit 1
            fi
          done < <(printf '%s\n' "${release_tags[@]}")

          gh auth setup-git
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            remote_sha="$(remote_tag_commit "$tag")"
            if [ "$remote_sha" = "$GITHUB_SHA" ]; then
              continue
            fi
            git \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$tag" "$GITHUB_SHA" -m "$tag"
            git push origin "refs/tags/$tag:refs/tags/$tag"
          done < <(printf '%s\n' "${release_tags[@]}")

      - name: Publish aggregate GitHub release
        if: inputs.channel == 'latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS_JSON: ${{ needs.collect_tags.outputs.release_tags_json }}
        run: |
          set -euo pipefail

          sdk_tag="$(
            jq -r '.[] | select(startswith("@zhivex-ai/sdk@"))' \
              <<< "$RELEASE_TAGS_JSON"
          )"
          if [ -z "$sdk_tag" ]; then
            echo "No @zhivex-ai/sdk tag was generated; skipping aggregate release."
            exit 0
          fi

          gh release create "$sdk_tag" \
            --verify-tag \
            --generate-notes \
            --title "Zhivex AI SDK ${sdk_tag##*@}"

  verify_public:
    name: Verify published packages on npm
    needs: publish
    if: needs.publish.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node for public registry verification
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Download validated release source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source-${{ github.sha }}
          path: .release

      - name: Verify validated package bytes
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 512 -c .release/SHA512SUMS

      - name: Verify published versions, dist-tags, and provenance
        run: bun run scripts/check-release-readiness.ts --postpublish --tag=${{ inputs.channel }} --release-batch-file=.release/zhivex-release-batch.json

      - name: Install published packages from the public registry
        run: bun run scripts/install-published-release.ts --release-batch-file=.release/zhivex-release-batch.json

      - name: Warn when next lags latest
        run: bun run scripts/align-next-dist-tag.ts
